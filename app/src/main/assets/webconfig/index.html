<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Launcher — Configuration</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px system-ui, sans-serif; margin: 0; background: #0b0f14; color: #e6edf3; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 32px; }
  label { display: block; margin: 12px 0 4px; color: #9fb0c0; }
  input[type=text], input[type=number], select { width: 100%; box-sizing: border-box;
    padding: 10px; border-radius: 8px; border: 1px solid #26313d; background: #121a24; color: inherit; }
  button { margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #2f81f7; color: #fff; font-weight: 600; cursor: pointer; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .status { padding: 8px 12px; border-radius: 8px; background: #121a24; margin-bottom: 16px; }
  .ok { color: #3fb950; } .bad { color: #f85149; }
</style>
</head>
<body>
<main>
  <h1>Portal Launcher — Configuration</h1>
  <div id="status" class="status">…</div>

  <h2>Réglages de base</h2>
  <label>Nom de l'appareil</label><input type="text" id="deviceName">
  <label>URL Home Assistant</label><input type="text" id="haUrl">
  <label>Token HA (laisser vide pour conserver)</label><input type="text" id="haToken" placeholder="•••">
  <div class="row">
    <div><label>Broker MQTT</label><input type="text" id="brokerHost"></div>
    <div><label>Port</label><input type="number" id="brokerPort"></div>
  </div>
  <label>Fond d'écran</label>
  <select id="backgroundMode">
    <option value="neutral">Neutre</option>
    <option value="nature">Nature</option>
    <option value="custom">Photo perso</option>
  </select>
  <button id="save">Enregistrer</button>

  <h2>Photo de fond</h2>
  <input type="file" id="wallpaper" accept="image/*">
  <button id="upload">Téléverser</button>
  <button id="removeWp" style="background:#6e2f2f">Supprimer</button>
</main>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  const H = { 'Authorization': 'Bearer ' + token };
  const $ = id => document.getElementById(id);
  const fields = ['deviceName','haUrl','brokerHost','brokerPort','backgroundMode'];

  async function loadStatus() {
    try {
      const s = await (await fetch('/api/status', { headers: H })).json();
      $('status').innerHTML =
        `HA <span class="${s.haConnected?'ok':'bad'}">${s.haConnected?'✓':'✗'}</span> · ` +
        `MQTT <span class="${s.mqttConnected?'ok':'bad'}">${s.mqttConnected?'✓':'✗'}</span> · ` +
        `${s.ip} · v${s.version}`;
    } catch (e) { $('status').textContent = 'Erreur de connexion'; }
  }
  async function loadSettings() {
    const s = await (await fetch('/api/settings', { headers: H })).json();
    fields.forEach(f => $(f).value = s[f]);
    $('haToken').value = '';
    $('haToken').placeholder = s.haToken ? '•••••• (défini)' : 'non défini';
  }
  $('save').onclick = async () => {
    const body = {};
    fields.forEach(f => body[f] = $(f).id === 'brokerPort' ? Number($(f).value) : $(f).value);
    if ($('haToken').value) body.haToken = $('haToken').value;
    await fetch('/api/settings', { method:'POST', headers: {...H,'Content-Type':'application/json'}, body: JSON.stringify(body) });
    await loadSettings(); alert('Enregistré');
  };
  $('upload').onclick = async () => {
    const f = $('wallpaper').files[0]; if (!f) return alert('Choisir un fichier');
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/api/wallpaper', { method:'POST', headers: H, body: fd });
    if (r.ok) { await loadSettings(); alert('Fond mis à jour'); } else alert('Refusé: ' + (await r.text()));
  };
  $('removeWp').onclick = async () => {
    await fetch('/api/wallpaper', { method:'DELETE', headers: H });
    await loadSettings(); alert('Fond supprimé');
  };
  loadStatus(); loadSettings();
</script>
</body>
</html>
